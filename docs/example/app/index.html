<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Manager</title>
<meta name="description" content="Prompt Manager – the result of the KissSDD step-by-step example. Save, find, edit and copy your AI prompts.">
<link rel="icon" href="../../img/icons/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --navy: #0f3f86; --blue: #1f6fe0; --green: #3fae3a; --red: #c62828;
    --bg: #f5f8fd; --card: #ffffff; --text: #13213a; --muted: #55627a; --line: #dbe4f2; --tint: #eaf1fc;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --navy: #8fb6ff; --blue: #6aa3ff; --green: #6fd067; --red: #ff8a80;
      --bg: #0c1424; --card: #131e33; --text: #e6ecf7; --muted: #9aa8c2; --line: #24324d; --tint: #16233d;
    }
  }
  :root[data-theme="dark"] {
    --navy: #8fb6ff; --blue: #6aa3ff; --green: #6fd067; --red: #ff8a80;
    --bg: #0c1424; --card: #131e33; --text: #e6ecf7; --muted: #9aa8c2; --line: #24324d; --tint: #16233d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 28px; color: var(--navy); }
  header a { font-size: 14px; color: var(--blue); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-top: 18px; }
  label { display: block; font-weight: 600; font-size: 14px; margin: 10px 0 4px; }
  input, textarea { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }
  textarea { min-height: 120px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; }
  .hint { font-size: 13px; color: var(--muted); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  button { font: inherit; font-size: 14px; font-weight: 600; border-radius: 8px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  button.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
  :root[data-theme="dark"] button.primary { color: #0c1424; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.primary { color: #0c1424; } }
  button.danger { color: var(--red); }
  .errors { color: var(--red); margin: 10px 0 0; padding-left: 20px; font-size: 14px; }
  .status { min-height: 22px; margin-top: 12px; font-size: 14px; color: var(--green); }
  .status.warn { color: var(--red); }
  .search { margin-top: 18px; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 12px; }
  .item-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
  .item-head h2 { margin: 0; font-size: 18px; overflow-wrap: anywhere; }
  .meta { font-size: 12px; color: var(--muted); }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--tint); border-radius: 8px; padding: 10px 12px; margin: 10px 0 0; font-size: 14px; max-height: 180px; overflow: auto; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .tag { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--tint); color: var(--navy); }
  .empty { color: var(--muted); text-align: center; padding: 28px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Prompt Manager</h1>
    <a href="../index.html">← Back to the KissSDD example</a>
  </header>

  <form id="form" class="card" novalidate>
    <strong id="form-title">New prompt</strong>
    <label for="title">Title</label>
    <input id="title" maxlength="100" autocomplete="off" required>
    <label for="text">Prompt text</label>
    <textarea id="text" maxlength="10000" required></textarea>
    <label for="tags">Tags</label>
    <input id="tags" autocomplete="off" placeholder="e.g. java, review">
    <div class="hint">Comma-separated, up to 5 tags, a–z, 0–9 and “-”.</div>
    <ul id="errors" class="errors" role="alert"></ul>
    <div class="row">
      <button type="submit" class="primary" id="save">Save prompt</button>
      <button type="button" id="cancel" hidden>Cancel</button>
    </div>
  </form>

  <div id="status" class="status" role="status" aria-live="polite"></div>

  <div class="search">
    <label for="search">Search</label>
    <input id="search" type="search" placeholder="Search title, text or tag" autocomplete="off">
  </div>

  <ul id="list" class="list" aria-label="Saved prompts"></ul>
  <p id="empty" class="empty" hidden></p>
</div>
<script src="prompt-store.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
